# infretis run, with a setup through infinit
[runner]
workers = 4
wmdrun = [
    "not used",
    "not used",
    "not used",
    "not used",
]

[simulation]
interfaces = [
    0.31,
    0.33,
    0.345,
    0.35,
    0.355,
    0.36,
    0.37,
    0.48,
]
shooting_moves = [
    "sh",
    "sh",
    "wf",
    "wf",
    "wf",
    "wf",
    "wf",
    "wf",


]
steps = 3010
seed = 0
load_dir = "load/"

[simulation.tis_set]
interface_cap = 0.38
maxlength = 20000
aimless = true
allowmaxlength = false
zero_momentum = true
rescale_energy = false
temperature = 300

[engine]
class = "ams"
engine = "ams"
timestep = 0.00025
input_path = "ams_inp"
subcycles = 40

[box.settings]
periodic = [
    true,
    true,
    true,
]

[orderparameter]
class = "Distance"
index = [
    0,
    1,
]
periodic = true

[output]
backup = "backup"
data_dir = "./"
order-file = 1
energy-file = 1
trajectory-file = -1
screen = 1
pattern = 1
delete_old = true
